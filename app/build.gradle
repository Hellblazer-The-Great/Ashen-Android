plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashen.prototype'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ashen.prototype'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The game is written in plain Java 8 syntax (no records, pattern matching or switch arrows).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
